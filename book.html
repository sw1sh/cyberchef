<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CyberChef recipe book</title><style>:root{--bg:#fafafa;--fg:#222;--panel:#fff;--line:#ddd;--accent:#1e6fbf;--muted:#666}@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e6e6e6;--panel:#1f2228;--line:#333842;--accent:#5aa9f0;--muted:#9aa0a8}}*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;height:100vh}nav{width:300px;border-right:1px solid var(--line);overflow:auto;padding:12px;flex-shrink:0}nav h1{font-size:16px;margin:0 0 4px}nav p{color:var(--muted);font-size:12px;margin:0 0 10px}nav ul{list-style:none;padding:0;margin:0 0 10px}nav li{padding:6px 8px;border-radius:6px;cursor:pointer}nav li:hover{background:var(--panel)}nav li.active{background:var(--accent);color:#fff}main button,nav button{margin:2px 2px 2px 0;padding:4px 8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:4px;cursor:pointer}main{flex:1;display:flex;flex-direction:column;padding:12px;gap:8px;min-width:0}main label{font-weight:600;font-size:12px;color:var(--muted)}input[type=text],textarea{width:100%;font:13px/1.4 ui-monospace,monospace;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px}textarea{resize:vertical}#input,#output{min-height:90px;flex:1;word-break:break-all}#recipe{min-height:90px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}a{color:var(--accent)}#status{color:var(--muted);font-size:12px}@media (width<=700px){body{flex-direction:column;height:auto}nav{width:100%;border-right:0;border-bottom:1px solid var(--line)}}</style><script defer src=assets/book.js></script></head><body><nav><h1>Recipe book</h1><p>Every recipe in one link. Arrow keys or j/k to browse.<ul id=entries></ul><button id=add>Add from CyberChef link</button> <button id=up>Move up</button> <button id=remove>Remove</button> <button id=copy>Copy book link</button><p><a href=index.html>CyberChef</a> · <a href=graph.html>Graph editor</a></nav><main><div class=row><button id=prev>←</button><input id=title><button id=nextb>→</button></div><label for=input>Input</label> <textarea id=input spellcheck=false></textarea> <label for=recipe>Recipe (CyberChef recipe format, one operation a line)</label> <textarea id=recipe spellcheck=false></textarea><div class=row><button id=apply>Apply edits</button><a id=open target=_blank rel=noopener>Open in CyberChef</a><span id=status></span></div><label for=output>Output</label> <textarea id=output readonly spellcheck=false></textarea></main></body></html>
